name: lunar-explorer

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    env_file: .env
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - moon-sky

  moon-sky:
    build:
      context: ../moon-sky
      dockerfile: ../docker/moon-sky.Dockerfile
    ports:
      - "${MOON_SKY_PORT:-3001}:3001"
    volumes:
      - ../moon-sky:/app
